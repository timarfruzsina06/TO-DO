function lilyMotif(cx, cy, scale, rotate, variant, withSpeckles) {
  const petal = (angle, i) => {
    const speckles =
      withSpeckles && i < 2
        ? `<circle cx="1.6" cy="-5" r="0.5" fill="${variant.speck}" fill-opacity="0.55"/>
           <circle cx="-1.2" cy="-7" r="0.4" fill="${variant.speck}" fill-opacity="0.5"/>
           <circle cx="0.8" cy="-8.5" r="0.4" fill="${variant.speck}" fill-opacity="0.5"/>`
        : "";
    return `<g transform="rotate(${angle})">
      <path d="M0,0 C7,-3 8,-13 4,-20 C6,-22 3,-23.5 0,-21 C-3,-23.5 -6,-22 -4,-20 C-8,-13 -7,-3 0,0 Z" fill="url(#${variant.grad})"/>
      <path d="M0,-2 Q1.2,-11 0,-20" fill="none" stroke="${variant.vein}" stroke-width="0.6" stroke-opacity="0.45"/>
      ${speckles}
    </g>`;
  };
  const petals = [0, 60, 120, 180, 240, 300].map(petal).join("");
  const stamen = (angle, len) => `<g transform="rotate(${angle})">
    <path d="M0,0 Q3,-${len * 0.6} 2,-${len}" fill="none" stroke="#AABE7C" stroke-width="0.9" stroke-linecap="round"/>
    <ellipse cx="2" cy="-${len}" rx="1.4" ry="2.3" fill="#B5651D" transform="rotate(${angle / 2} 2 -${len})"/>
  </g>`;
  const stamens = [
    stamen(8, 10),
    stamen(-22, 11),
    stamen(48, 9),
    stamen(-52, 10),
    stamen(78, 8),
  ].join("");
  return `<g transform="translate(${cx},${cy}) rotate(${rotate}) scale(${scale})">
    ${petals}${stamens}
    <path d="M0,0 L0,-6" stroke="#CBDBA0" stroke-width="1.1" stroke-linecap="round"/>
    <ellipse cx="0" cy="-6.5" rx="1" ry="1.4" fill="#CBDBA0"/>
  </g>`;
}

function assignColumns(events) {
  const sorted = [...events].sort((a, b) => a.start - b.start);
  const colEnds = [];
  const placed = sorted.map((ev) => {
    let col = colEnds.findIndex((end) => end <= ev.start);
    if (col === -1) { col = colEnds.length; colEnds.push(ev.end); }
    else { colEnds[col] = ev.end; }
    return { ...ev, col };
  });
  const totalCols = Math.max(1, colEnds.length);
  return placed.map((p) => ({ ...p, totalCols }));
}

const HU_MONTHS = {
  "január": 1, "február": 2, "március": 3, "április": 4, "május": 5, "június": 6,

// Rugalmas dátum-idő felismerés: "2026. szeptember 7. 10:00" formátumhoz,
// de elfogad ISO-szerű vagy simán "2026-09-07 10:00" jellegű bejegyzéseket is.
function parseFlexibleDateTime(raw) {
  if (raw == null) return null;
  if (raw instanceof Date && !isNaN(raw)) return raw;
  const s = String(raw).trim();
  let m = s.match(/(\d{4})\.\s*([a-záéíóöőúüű]+)\s*(\d{1,2})\.?\s*(\d{1,2}):(\d{2})/i);
  if (m) {
    const month = HU_MONTHS[m[2].toLowerCase()];
    if (month) return new Date(Number(m[1]), month - 1, Number(m[3]), Number(m[4]), Number(m[5]));
  }
  m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5]));
  m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\.?\s*(\d{1,2}):(\d{2})/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4]), Number(m[5]));
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

// Oszlop-felismerés különböző elnevezésekhez (magyar Neptun-export és általánosabb változatok)
const COLUMN_ALIASES = {

function findColumnIndex(headerRow, aliases) {
  for (let i = 0; i < headerRow.length; i++) {
    const cell = String(headerRow[i] || "").toLowerCase().trim();
    if (aliases.some((a) => cell.includes(a))) return i;
  }
  return -1;
}
function findHeaderRow(rows) {
  for (let i = 0; i < Math.min(rows.length, 5); i++) {
    const idx = findColumnIndex(rows[i] || [], COLUMN_ALIASES.start);
    if (idx !== -1) return i;
  }
  return -1;
}
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function getMonday(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return addDays(d, diff);
}
function daysBetween(a, b) {
  return Math.round(
    (Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
      Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) /
      86400000
  );
}
function isSameDay(a, b) { return dateKey(a) === dateKey(b); }
function parseKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function buildMonthMatrix(monthDate) {
  const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const start = getMonday(first);
  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(addDays(start, i));
  return cells;
}

function taskOccursOn(task, d) {
  const diff = daysBetween(task.anchorDate, d);
  if (diff < 0) return false;
  switch (task.recurrence) {
    case "none": return diff === 0;
    case "daily": return true;
    case "every2": return diff % 2 === 0;
    case "weekly": return diff % 7 === 0;
    default: return false;
  }
}

function WeeklyPlanner() {
  const [weekStart, setWeekStart] = useState(getMonday(getToday()));
  const [tasks, setTasks] = useState([]);
  const [generalTasks, setGeneralTasks] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [generalText, setGeneralText] = useState("");
  const [generalCategory, setGeneralCategory] = useState("none");
  const [addingFor, setAddingFor] = useState(null);
  const [newText, setNewText] = useState("");
  const [newRecurrence, setNewRecurrence] = useState("none");
  const [newCategory, setNewCategory] = useState("none");
  const [newStartTime, setNewStartTime] = useState("");
  const [newEndTime, setNewEndTime] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("all");
  const [importMessage, setImportMessage] = useState(null);
  const [expandedNotes, setExpandedNotes] = useState(() => new Set());
  const fileInputRef = React.useRef(null);

  function toggleNoteOpen(id) {
    setExpandedNotes((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function handleImportClick() {
    if (fileInputRef.current) fileInputRef.current.click();
  }

  function finalizeImport(imported, sourceLabel, extraNote) {
    if (!imported || imported.length === 0) {
      setImportMessage({
        type: "error",
        text: `Nem találtam felismerhető eseményt ebben a ${sourceLabel} fájlban.${extraNote ? " " + extraNote : ""}`,
      });
      return;
    }
    setTasks((ts) => [...ts, ...imported]);
    setImportMessage({
      type: "success",
      text: `${imported.length} esemény importálva (${sourceLabel}).${extraNote ? " " + extraNote : ""}`,
    });
  }

  // Szabad szöveges (PDF-ből kinyert, vagy OCR-ezett) tartalom sorról-sorra
  // átvizsgálása: minden sorban dátum+idő mintát keres, a maradék szöveget
  // névnek tekinti. Ez becslés jellegű, ezért kép/PDF esetén érdemes
  // utólag ellenőrizni az eredményt.
  function parseGenericScheduleText(text) {
    const dtPattern = /(\d{4}\.\s*[a-záéíóöőúüű]+\s*\d{1,2}\.?\s*\d{1,2}:\d{2}|\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}|\d{1,2}\.\d{1,2}\.\d{4}\.?\s*\d{1,2}:\d{2})/gi;
    const lines = text.split(/\r?\n/);
    const imported = [];
    for (const line of lines) {
      const matches = line.match(dtPattern);
      if (!matches || matches.length === 0) continue;
      const startDate = parseFlexibleDateTime(matches[0]);
      if (!startDate) continue;
      const endDate = matches[1] ? parseFlexibleDateTime(matches[1]) : null;
      let rest = line;
      matches.forEach((m) => { rest = rest.replace(m, " "); });
      rest = rest.replace(/[|;]+/g, " ").replace(/\s{2,}/g, " ").trim();
      if (!rest) rest = "Esemény";
      const startTime = `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`;
      const endTime = endDate ? `${pad(endDate.getHours())}:${pad(endDate.getMinutes())}` : null;
      imported.push({
        id: nextId(),
        text: rest,
        anchorDate: new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()),
        recurrence: "none",
        category: "egyetem",
        completions: {},
        note: "",
        startTime,
        endTime,
      });
    }
    return imported;
  }

  function importFromSpreadsheet(file) {
    if (typeof XLSX === "undefined") {
      setImportMessage({ type: "error", text: "Az importáló könyvtár nem tölthető be, ellenőrizd az internetkapcsolatot." });
      return;
    }
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });

        const headerRowIdx = findHeaderRow(rows);
        if (headerRowIdx === -1) {
          setImportMessage({ type: "error", text: "Nem sikerült felismerni az oszlopokat ebben a fájlban." });
          return;
        }
        const headerRow = rows[headerRowIdx];
        const startIdx = findColumnIndex(headerRow, COLUMN_ALIASES.start);
        const endIdx = findColumnIndex(headerRow, COLUMN_ALIASES.end);
        const nameIdx = findColumnIndex(headerRow, COLUMN_ALIASES.name);

        if (startIdx === -1 || nameIdx === -1) {
          setImportMessage({ type: "error", text: "Nem találtam kezdés- és névoszlopot a fájlban." });
          return;
        }

        const imported = [];
        for (let i = headerRowIdx + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;
          const startDate = parseFlexibleDateTime(row[startIdx]);
          if (!startDate) continue;
          const name = String(row[nameIdx] || "").trim();
          if (!name) continue;
          const endDate = endIdx !== -1 ? parseFlexibleDateTime(row[endIdx]) : null;
          const startTime = `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`;
          const endTime = endDate ? `${pad(endDate.getHours())}:${pad(endDate.getMinutes())}` : null;
          imported.push({
            id: nextId(),
            text: name,
            anchorDate: new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()),
            recurrence: "none",
            category: "egyetem",
            completions: {},
            note: "",
            startTime,
            endTime,
          });
        }
        finalizeImport(imported, "táblázat");
      } catch (err) {
        setImportMessage({ type: "error", text: "Hiba történt a fájl feldolgozása közben." });
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function importFromPdf(file) {
    if (typeof pdfjsLib === "undefined") {
      setImportMessage({ type: "error", text: "A PDF-olvasó könyvtár nem tölthető be, ellenőrizd az internetkapcsolatot." });
      return;
    }
    setImportMessage({ type: "info", text: "PDF feldolgozása…" });
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const typedarray = new Uint8Array(evt.target.result);
        const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map((it) => it.str).join(" ") + "\n";
        }
        const imported = parseGenericScheduleText(fullText);
        finalizeImport(
          imported,
          "PDF",
          "Ha egy szkennelt/kép-alapú PDF-ről van szó, előfordulhat, hogy nem talált szöveget – ilyenkor próbáld képként feltölteni."
        );
      } catch (err) {
        setImportMessage({ type: "error", text: "Nem sikerült beolvasni a PDF-et." });
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function importFromImage(file) {
    if (typeof Tesseract === "undefined") {
      setImportMessage({ type: "error", text: "A képfelismerő könyvtár nem tölthető be, ellenőrizd az internetkapcsolatot." });
      return;
    }
    setImportMessage({ type: "info", text: "Kép felismerése folyamatban… ez eltarthat fél-egy percig." });
    Tesseract.recognize(file, "hun+eng")
      .then(({ data: { text } }) => {
        const imported = parseGenericScheduleText(text);
        finalizeImport(
          imported,
          "kép",
          "A képfelismerés nem tökéletes, érdemes ellenőrizni és javítani a bekerült teendőket."
        );
      })
      .catch(() => {
        setImportMessage({ type: "error", text: "Nem sikerült feldolgozni a képet." });
      });
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const name = file.name.toLowerCase();
    if (name.endsWith(".xlsx") || name.endsWith(".xls") || name.endsWith(".csv")) {
      importFromSpreadsheet(file);
    } else if (name.endsWith(".pdf") || file.type === "application/pdf") {
      importFromPdf(file);
    } else if (file.type.startsWith("image/")) {
      importFromImage(file);
    } else {
      setImportMessage({ type: "error", text: "Nem támogatott fájltípus. Excel, PDF vagy kép fájlt tölts fel." });
    }
  }

  const [selectedDay, setSelectedDay] = useState(getToday());
  const [windowWidth, setWindowWidth] = useState(
    typeof window !== "undefined" ? window.innerWidth : 1200
  );

  useEffect(() => {
    function onResize() { setWindowWidth(window.innerWidth); }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const isCompact = windowWidth < 720;

  // Percenkénti "ébresztő", hogy ha éjfél után is nyitva marad az app,
  // a mai nap kiemelése és a lejárt feladatok tisztítása magától frissüljön.
  const [, forceTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => forceTick((t) => t + 1), 60000);
    return () => clearInterval(id);
  }, []);

  // Élő Firestore-szinkronizálás: bármelyik eszközön történik változás,
  // az azonnal megjelenik a másikon is (onSnapshot valós idejű figyelő).
  const isRemoteUpdate = React.useRef(false);

  useEffect(() => {
    const unsub = todoDocRef.onSnapshot(
      (snap) => {
        let loadedTasks = SEED_TASKS;
        let loadedGeneral = SEED_GENERAL;
        if (snap.exists) {
          const data = snap.data();
          if (data.tasks) {
            loadedTasks = JSON.parse(data.tasks).map((t) => ({ ...t, anchorDate: parseKey(t.anchorDate) }));
          }
          if (data.generalTasks) loadedGeneral = JSON.parse(data.generalTasks);
        }

        loadedTasks = loadedTasks.filter((t) => {
          if (t.recurrence !== "none") return true;
          const isPast = daysBetween(t.anchorDate, getToday()) > 0;
          const wasCompleted = !!t.completions[dateKey(t.anchorDate)];
          return !(isPast && wasCompleted);
        });

        isRemoteUpdate.current = true;
        setTasks(loadedTasks);
        setGeneralTasks(loadedGeneral);
        setLoaded(true);
        setSyncError(false);

        if (!snap.exists) {
          todoDocRef.set({
            tasks: JSON.stringify(loadedTasks.map((t) => ({ ...t, anchorDate: dateKey(t.anchorDate) }))),
            generalTasks: JSON.stringify(loadedGeneral),
          });
        }
      },
      () => {
        setSyncError(true);
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  // Minden helyi változás után automatikusan mentés a felhőbe
  useEffect(() => {
    if (!loaded) return;
    if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
    const toSave = tasks.map((t) => ({ ...t, anchorDate: dateKey(t.anchorDate) }));
    todoDocRef.set({ tasks: JSON.stringify(toSave) }, { merge: true }).catch(() => setSyncError(true));
  }, [tasks, loaded]);

  useEffect(() => {
    if (!loaded) return;
    if (isRemoteUpdate.current) { return; }
    todoDocRef.set({ generalTasks: JSON.stringify(generalTasks) }, { merge: true }).catch(() => setSyncError(true));
  }, [generalTasks, loaded]);

  if (!loaded) {
    return (
      <div
        style={{
          fontFamily: "'Work Sans', sans-serif",
          background: COLORS.bg,
          color: COLORS.textSoft,
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          fontSize: 14,
          textAlign: "center",
          padding: 20,
        }}
      >
        {syncError
          ? "Nem sikerült csatlakozni a szinkronizált tárolóhoz. Ellenőrizd az internetkapcsolatot, majd töltsd újra az oldalt."
          : "Betöltés\u2026"}
      </div>
    );
  }

  const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const weekEnd = weekDays[6];

  const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
  const weekLabel = sameMonth
    ? `${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getDate()}\u2013${weekEnd.getDate()}.`
    : `${MONTH_SHORT[weekStart.getMonth()]} ${weekStart.getDate()}. \u2013 ${MONTH_SHORT[weekEnd.getMonth()]} ${weekEnd.getDate()}.`;

  const monthMatrix = buildMonthMatrix(weekStart);
  const miniMonthLabel = `${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getFullYear()}`;
  const filteredGeneral = generalTasks.filter(
    (g) => categoryFilter === "all" || g.category === categoryFilter
  );

  function goWeek(delta) {
    setWeekStart((w) => addDays(w, delta * 7));
    setSelectedDay((d) => addDays(d, delta * 7));
  }
  function goMonth(delta) {
    const d = new Date(weekStart.getFullYear(), weekStart.getMonth() + delta, 1);
    setWeekStart(getMonday(d));
  }
  function jumpToDate(d) {
    setWeekStart(getMonday(d));
    setSelectedDay(d);
  }

  function openAddForm(dKey) {
    setAddingFor(dKey);
    setNewText("");
    setNewRecurrence("none");
    setNewCategory("none");
    setNewStartTime("");
    setNewEndTime("");
  }
  function closeAddForm() {
    setAddingFor(null);
    setNewStartTime("");
    setNewEndTime("");
  }

  function submitTask(day) {
    const text = newText.trim();
    if (!text) return;
    setTasks((ts) => [
      ...ts,
      {
        id: nextId(),
        text,
        anchorDate: new Date(day.getFullYear(), day.getMonth(), day.getDate()),
        recurrence: newRecurrence,
        category: newCategory,
        completions: {},
        note: "",
        startTime: newStartTime || null,
        endTime: newEndTime || null,
      },
    ]);
    setAddingFor(null);
    setNewText("");
    setNewRecurrence("none");
    setNewCategory("none");
    setNewStartTime("");
    setNewEndTime("");
  }

  function renderTaskItem(task, dKey, isTodayCol) {
    const done = !!task.completions[dKey];
    const shouldPulse = isTodayCol && task.recurrence !== "none" && !done;
    return (
      <div
        key={task.id + dKey}
        className={`task-row${shouldPulse ? " pulse-task" : ""}`}
        style={{
          display: "flex",
          flexDirection: "column",
          gap: 5,
          background: "#fff",
          border: `1px solid ${COLORS.border}`,
          borderRadius: 10,
          padding: "6px 8px",
          minWidth: 0,
          boxSizing: "border-box",
        }}
      >
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, minWidth: 0 }}>
          <button
            onClick={() => toggleCompletion(task.id, dKey)}
            aria-label={done ? "Kész" : "Nincs kész"}
            style={{
              width: 20,
              height: 20,
              borderRadius: 6,
              border: `1.5px solid ${COLORS.accent}`,
              background: done ? COLORS.panel : "transparent",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
              flexShrink: 0,
              padding: 0,
              fontSize: 12,
              lineHeight: 1,
            }}
          >
            {done && "✅"}
          </button>
          <span
            style={{
              fontSize: 13,
              flex: "1 1 0%",
              minWidth: 0,
              whiteSpace: "nowrap",
              overflow: "hidden",
              textOverflow: "ellipsis",
              textDecoration: done ? "line-through" : "none",
              color: done ? COLORS.textSoft : COLORS.text,
            }}
          >
            {task.startTime ? `${task.startTime}${task.endTime ? "–" + task.endTime : ""} ` : ""}
            {task.text}
          </span>
          <button
            onClick={() => toggleNoteOpen(task.id)}
            aria-label="Jegyzet"
            title="Jegyzet"
            style={{
              border: "none",
              background: "transparent",
              cursor: "pointer",
              color: task.note ? COLORS.accentDark : COLORS.textSoft,
              opacity: 1,
              flexShrink: 0,
              padding: 0,
              marginTop: 2,
              fontSize: 13,
              lineHeight: 1,
            }}
          >
            🗒️
          </button>
          <button
            onClick={() => deleteTask(task.id)}
            aria-label="Törlés"
            style={{
              border: "none",
              background: "transparent",
              cursor: "pointer",
              color: COLORS.textSoft,
              opacity: 1,
              flexShrink: 0,
              padding: 0,
              marginTop: 2,
            }}
          >
            <X size={13} />
          </button>
        </div>
        {(task.category !== "none" || task.recurrence !== "none") && (
          <div style={{ display: "flex", alignItems: "center", gap: 6, paddingLeft: 24 }}>
            {task.category !== "none" && CATEGORY_STYLES[task.category] && (
              <span
                style={{
                  fontSize: 10,
                  fontWeight: 500,
                  padding: "2px 7px",
                  borderRadius: 999,
                  background: CATEGORY_STYLES[task.category].bg,
                  color: CATEGORY_STYLES[task.category].text,
                  whiteSpace: "nowrap",
                }}
              >
                {CATEGORY_STYLES[task.category].label}
              </span>
            )}
            {task.recurrence !== "none" && (
              <span title={RECUR_LABELS[task.recurrence]} style={{ color: COLORS.textSoft, display: "flex" }}>
                <RefreshCw size={11} />
              </span>
            )}
          </div>
        )}
        {expandedNotes.has(task.id) ? (
          <textarea
            value={task.note || ""}
            onChange={(e) => updateTaskNote(task.id, e.target.value)}
            placeholder="Jegyzet ehhez a teendőhöz…"
            style={{
              marginTop: 4,
              marginLeft: 24,
              fontSize: 12,
              padding: "5px 7px",
              borderRadius: 8,
              border: `1px solid ${COLORS.border}`,
              background: "#fff",
              fontFamily: "'Work Sans', sans-serif",
              resize: "vertical",
              minHeight: 40,
            }}
          />
        ) : task.note ? (
          <div
            onClick={() => toggleNoteOpen(task.id)}
            style={{
              marginTop: 4,
              marginLeft: 24,
              fontSize: 11,
              fontStyle: "italic",
              color: COLORS.textSoft,
              cursor: "pointer",
              whiteSpace: "nowrap",
              overflow: "hidden",
              textOverflow: "ellipsis",
            }}
          >
            {task.note}
          </div>
        ) : null}
      </div>
    );
  }

  function renderEventBlock(task, dKey, isTodayCol, startMin, endMin) {
    const done = !!task.completions[dKey];
    const shouldPulse = isTodayCol && task.recurrence !== "none" && !done;
    const catStyle = task.category !== "none" && CATEGORY_STYLES[task.category] ? CATEGORY_STYLES[task.category] : null;
    const bg = catStyle ? catStyle.bg : "#fff";
    const textColor = catStyle ? catStyle.text : COLORS.text;
    const heightPx = Math.max(20, ((endMin - startMin) / 60) * HOUR_HEIGHT);
    const isTiny = heightPx < 34;
    return (
      <div
        key={task.id + dKey}
        className={`task-row${shouldPulse ? " pulse-task" : ""}`}
        style={{
          position: "absolute",
          inset: 0,
          background: bg,
          border: `1px solid ${COLORS.border}`,
          borderLeft: `3px solid ${COLORS.accent}`,
          borderRadius: 6,
          padding: isTiny ? "1px 4px" : "3px 5px",
          overflow: "hidden",
          display: "flex",
          flexDirection: isTiny ? "row" : "column",
          alignItems: isTiny ? "center" : "stretch",
          gap: 2,
          boxSizing: "border-box",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 4, minWidth: 0, flex: isTiny ? "1 1 auto" : "0 0 auto" }}>
          <button
            onClick={() => toggleCompletion(task.id, dKey)}
            aria-label={done ? "Kész" : "Nincs kész"}
            style={{
              width: 13,
              height: 13,
              borderRadius: 4,
              border: `1.3px solid ${COLORS.accent}`,
              background: done ? COLORS.accent : "transparent",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
              flexShrink: 0,
              padding: 0,
              fontSize: 8,
              lineHeight: 1,
            }}
          >
            {done && "✓"}
          </button>
          <span
            title={task.text}
            style={{
              fontSize: 11,
              lineHeight: 1.15,
              minWidth: 0,
              flex: "1 1 auto",
              whiteSpace: "nowrap",
              overflow: "hidden",
              textOverflow: "ellipsis",
              textDecoration: done ? "line-through" : "none",
              color: done ? COLORS.textSoft : textColor,
              fontWeight: 500,
            }}
          >
            {task.startTime}{task.endTime ? `–${task.endTime}` : ""} {task.text}
          </span>
          <button
            onClick={() => toggleNoteOpen(task.id)}
            aria-label="Jegyzet"
            title="Jegyzet"
            style={{ border: "none", background: "transparent", cursor: "pointer", color: task.note ? COLORS.accentDark : COLORS.textSoft, flexShrink: 0, padding: 0, fontSize: 10, lineHeight: 1 }}
          >
            🗒️
          </button>
          <button
            onClick={() => deleteTask(task.id)}
            aria-label="Törlés"
            style={{ border: "none", background: "transparent", cursor: "pointer", color: COLORS.textSoft, flexShrink: 0, padding: 0 }}
          >
            <X size={11} />
          </button>
        </div>
        {task.recurrence !== "none" && !isTiny && (
          <span title={RECUR_LABELS[task.recurrence]} style={{ color: COLORS.textSoft, display: "flex" }}>
            <RefreshCw size={9} />
          </span>
        )}
        {expandedNotes.has(task.id) && (
          <div
            style={{
              position: "absolute",
              top: "100%",
              left: 0,
              right: 0,
              marginTop: 2,
              zIndex: 20,
              background: "#fff",
              border: `1px solid ${COLORS.border}`,
              borderRadius: 8,
              padding: 6,
              boxShadow: "0 4px 10px rgba(0,0,0,0.12)",
            }}
          >
            <textarea
              value={task.note || ""}
              onChange={(e) => updateTaskNote(task.id, e.target.value)}
              placeholder="Jegyzet ehhez a teendőhöz…"
              style={{
                width: "100%",
                boxSizing: "border-box",
                fontSize: 12,
                padding: "5px 7px",
                borderRadius: 8,
                border: `1px solid ${COLORS.border}`,
                background: "#fff",
                fontFamily: "'Work Sans', sans-serif",
                resize: "vertical",
                minHeight: 40,
              }}
            />
          </div>
        )}
      </div>
    );
  }

  function renderDayBody(dayTasks, dKey, isTodayCol, isAddingHere) {
    const untimed = dayTasks.filter((t) => !t.startTime);
    const timedRaw = dayTasks.filter((t) => t.startTime);

    const timedEvents = timedRaw.map((t) => {
      const s = clampMin(timeToMinutes(t.startTime) ?? DAY_START_MIN);
      let e = t.endTime ? timeToMinutes(t.endTime) : null;
      if (e == null || e <= s) e = s + 60;
      e = clampMin(e);
      if (e <= s) e = Math.min(DAY_END_MIN, s + 30);
      return { task: t, start: s, end: e };
    });
    const positioned = assignColumns(timedEvents);

    return (
      <>
        {dayTasks.length === 0 && !isAddingHere && (
          <div style={{ fontSize: 12, color: COLORS.textSoft, fontStyle: "italic", padding: "6px 2px" }}>
            Nincs teendő
          </div>
        )}
        {untimed.map((task) => renderTaskItem(task, dKey, isTodayCol))}

        {positioned.length > 0 && (
          <div style={{ marginTop: untimed.length ? 8 : 0, position: "relative", paddingLeft: 26 }}>
            <div style={{ position: "relative", height: TIMELINE_HEIGHT }}>
              {HOURS.map((h, idx) => {
                const top = ((h * 60 - DAY_START_MIN) / 60) * HOUR_HEIGHT;
                return (
                  <React.Fragment key={h}>
                    <div style={{ position: "absolute", top: top - 6, left: -26, width: 22, fontSize: 10, color: COLORS.textSoft, fontWeight: 600, textAlign: "right" }}>
                      {h}
                    </div>
                    <div style={{ position: "absolute", top, left: 0, right: 0, borderTop: `1px solid ${COLORS.border}` }} />
                    {idx < HOURS.length - 1 && (
                      <>
                        <div style={{ position: "absolute", top: top + HOUR_HEIGHT / 2 - 6, left: -26, width: 22, textAlign: "right", fontSize: 10, color: COLORS.border }}>
                          –
                        </div>
                        <div style={{ position: "absolute", top: top + HOUR_HEIGHT / 2, left: 0, right: 0, borderTop: `1px dashed ${COLORS.border}`, opacity: 0.55 }} />
                      </>
                    )}
                  </React.Fragment>
                );
              })}
              {positioned.map((ev) => {
                const top = ((ev.start - DAY_START_MIN) / 60) * HOUR_HEIGHT;
                const height = Math.max(20, ((ev.end - ev.start) / 60) * HOUR_HEIGHT);
                const widthPct = 100 / ev.totalCols;
                const leftPct = ev.col * widthPct;
                return (
                  <div
                    key={ev.task.id + dKey}
                    style={{
                      position: "absolute",
                      top,
                      height,
                      left: `calc(${leftPct}% + 1px)`,
                      width: `calc(${widthPct}% - 3px)`,
                    }}
                  >
                    {renderEventBlock(ev.task, dKey, isTodayCol, ev.start, ev.end)}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </>
    );
  }

  function toggleCompletion(taskId, dKey) {
    setTasks((ts) =>
      ts.map((t) =>
        t.id === taskId
          ? { ...t, completions: { ...t.completions, [dKey]: !t.completions[dKey] } }
          : t
      )
    );
  }

  function deleteTask(taskId) {
    setTasks((ts) => ts.filter((t) => t.id !== taskId));
  }

  function updateTaskNote(taskId, note) {
    setTasks((ts) => ts.map((t) => (t.id === taskId ? { ...t, note } : t)));
  }

  function addGeneralTask() {
    const text = generalText.trim();
    if (!text) return;
    setGeneralTasks((gs) => [...gs, { id: nextId(), text, category: generalCategory, completed: false, note: "" }]);
    setGeneralText("");
    setGeneralCategory("none");
  }
  function toggleGeneralTask(id) {
    setGeneralTasks((gs) => gs.map((g) => (g.id === id ? { ...g, completed: !g.completed } : g)));
  }
  function deleteGeneralTask(id) {
    setGeneralTasks((gs) => gs.filter((g) => g.id !== id));
  }
  function updateGeneralNote(id, note) {
    setGeneralTasks((gs) => gs.map((g) => (g.id === id ? { ...g, note } : g)));
  }


  return (
    <div
      style={{
        fontFamily: "'Work Sans', sans-serif",
        background: COLORS.bg,
        color: COLORS.text,
        minHeight: "100vh",
        padding: isCompact ? "20px 16px" : "40px 32px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Work+Sans:wght@400;500;600&display=swap');
        @keyframes softPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(139,0,45,0.7); border-color: #8B002D; }
          50% { box-shadow: 0 0 0 10px rgba(139,0,45,0); border-color: #C23056; }
        }
        .pulse-task { animation: softPulse 1.7s ease-in-out infinite; }
        .filter-chip:hover { background: ${COLORS.panel} !important; }
        .day-scroll::-webkit-scrollbar { width: 5px; }
        .day-scroll::-webkit-scrollbar-thumb { background: ${COLORS.border}; border-radius: 4px; }
        input[type="text"]:focus, select:focus { outline: none; }
        .mini-day:hover { background: ${COLORS.panel} !important; }
      `}</style>

      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        {/* Header */}
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "flex-start",
            flexWrap: "wrap",
            gap: 24,
            marginBottom: 32,
          }}
        >
          <div>
            <h1
              style={{
                fontFamily: "'Fraunces', serif",
                fontWeight: 900,
                fontSize: isCompact ? 40 : 74,
                lineHeight: 1,
                margin: 0,
                color: COLORS.accentDark,
              }}
            >
              Heti teendők
            </h1>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 10 }}>
              <button
                onClick={() => goWeek(-1)}
                aria-label="Előző hét"
                style={{
                  border: `1px solid ${COLORS.border}`,
                  background: COLORS.panelSoft,
                  borderRadius: 999,
                  width: 32,
                  height: 32,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                  color: COLORS.accentDark,
                }}
              >
                <ChevronLeft size={16} />
              </button>
              <span style={{ fontSize: 16, fontWeight: 500, minWidth: 190, letterSpacing: 0.2 }}>
                {weekLabel}
              </span>
              <button
                onClick={() => goWeek(1)}
                aria-label="Következő hét"
                style={{
                  border: `1px solid ${COLORS.border}`,
                  background: COLORS.panelSoft,
                  borderRadius: 999,
                  width: 32,
                  height: 32,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                  color: COLORS.accentDark,
                }}
              >
                <ChevronRight size={16} />
              </button>
            </div>
          </div>

          {/* Mini month calendar */}
          <div
            style={{
              background: COLORS.panelSoft,
              border: `1px solid ${COLORS.border}`,
              borderRadius: 20,
              padding: "14px 16px",
              width: 232,
              flexShrink: 0,
            }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <button
                onClick={() => goMonth(-1)}
                aria-label="Előző hónap"
                style={{ border: "none", background: "transparent", cursor: "pointer", color: COLORS.textSoft, padding: 2 }}
              >
                <ChevronLeft size={14} />
              </button>
              <span style={{ fontSize: 13, fontWeight: 500, color: COLORS.text }}>{miniMonthLabel}</span>
              <button
                onClick={() => goMonth(1)}
                aria-label="Következő hónap"
                style={{ border: "none", background: "transparent", cursor: "pointer", color: COLORS.textSoft, padding: 2 }}
              >
                <ChevronRight size={14} />
              </button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
              {DAY_LETTERS.map((l, i) => (
                <div key={i} style={{ textAlign: "center", fontSize: 10, color: COLORS.textSoft, fontWeight: 500, padding: "2px 0" }}>
                  {l}
                </div>
              ))}
              {monthMatrix.map((d, i) => {
                const inMonth = d.getMonth() === weekStart.getMonth();
                const isToday = isSameDay(d, getToday());
                const inCurrentWeek = weekDays.some((wd) => isSameDay(wd, d));
                return (
                  <button
                    key={i}
                    className="mini-day"
                    onClick={() => jumpToDate(d)}
                    style={{
                      border: "none",
                      cursor: "pointer",
                      fontSize: 11,
                      padding: "5px 0",
                      borderRadius: 8,
                      background: isToday ? COLORS.accent : inCurrentWeek ? COLORS.panel : "transparent",
                      color: isToday ? "#fff" : inMonth ? COLORS.text : COLORS.textSoft,
                      opacity: inMonth ? 1 : 0.45,
                      fontWeight: isToday ? 600 : 400,
                    }}
                  >
                    {d.getDate()}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Category filter */}
        <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
          {CATEGORY_FILTERS.map((f) => {
            const active = categoryFilter === f.value;
            const style = CATEGORY_STYLES[f.value];
            return (
              <button
                key={f.value}
                className="filter-chip"
                onClick={() => setCategoryFilter(f.value)}
                style={{
                  fontSize: 12,
                  fontWeight: 500,
                  padding: "6px 14px",
                  borderRadius: 999,
                  border: `1px solid ${active ? COLORS.accentDark : COLORS.border}`,
                  background: active ? (style ? style.bg : COLORS.panel) : "transparent",
                  color: active ? (style ? style.text : COLORS.accentDark) : COLORS.textSoft,
                  cursor: "pointer",
                }}
              >
                {f.label}
              </button>
            );
          })}

          <button
            onClick={handleImportClick}
            style={{
              fontSize: 12,
              fontWeight: 500,
              padding: "6px 14px",
              borderRadius: 999,
              border: `1px dashed ${COLORS.accentDark}`,
              background: "transparent",
              color: COLORS.accentDark,
              cursor: "pointer",
              marginLeft: "auto",
            }}
          >
            📥 Naptár importálása (Excel / PDF / kép)
          </button>
          <input
            ref={fileInputRef}
            type="file"
            accept=".xlsx,.xls,.csv,.pdf,image/*"
            onChange={handleImportFile}
            style={{ display: "none" }}
          />
        </div>

        {importMessage && (
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              gap: 10,
              fontSize: 12,
              padding: "8px 12px",
              borderRadius: 10,
              marginBottom: 14,
              background: importMessage.type === "error" ? "#FBE4E4" : COLORS.panel,
              color: importMessage.type === "error" ? "#B33A3A" : COLORS.accentDark,
              border: `1px solid ${importMessage.type === "error" ? "#E8AEAE" : COLORS.border}`,
            }}
          >
            <span>{importMessage.text}</span>
            <button
              onClick={() => setImportMessage(null)}
              style={{ border: "none", background: "transparent", cursor: "pointer", color: "inherit" }}
            >
              <X size={12} />
            </button>
          </div>
        )}

        {/* Week grid */}
        {!isCompact && (
        <div
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(7, minmax(210px, 1fr))",
            gap: 14,
            overflowX: "auto",
          }}
        >
          {weekDays.map((day) => {
            const dKey = dateKey(day);
            const isToday = isSameDay(day, getToday());
            const dayTasks = tasks
              .filter((t) => taskOccursOn(t, day))
              .filter((t) => categoryFilter === "all" || t.category === categoryFilter);
            const isAdding = addingFor === dKey;

            return (
              <div
                key={dKey}
                style={{
                  background: COLORS.panelSoft,
                  border: `1px solid ${isToday ? COLORS.accent : COLORS.border}`,
                  borderRadius: 18,
                  padding: "14px 12px",
                  display: "flex",
                  flexDirection: "column",
                  minHeight: 260,
                }}
              >
                <div style={{ marginBottom: 10 }}>
                  <div
                    style={{
                      fontFamily: "'Fraunces', serif",
                      fontWeight: 900,
                      fontSize: 22,
                      lineHeight: 1.1,
                      color: isToday ? COLORS.accentDark : COLORS.text,
                    }}
                  >
                    {DAY_NAMES[weekDays.indexOf(day)]}
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.textSoft, marginTop: 2 }}>
                    {pad(day.getDate())}.{pad(day.getMonth() + 1)}.
                  </div>
                </div>

                <div className="day-scroll" style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 6, minWidth: 0 }}>
                  {renderDayBody(dayTasks, dKey, isToday, isAdding)}
                </div>

                {isAdding ? (
                  <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                    <input
                      type="text"
                      autoFocus
                      value={newText}
                      onChange={(e) => setNewText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") submitTask(day);
                        if (e.key === "Escape") closeAddForm();
                      }}
                      placeholder="Új teendő"
                      style={{
                        fontSize: 13,
                        padding: "6px 8px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                      }}
                    />
                    <div style={{ display: "flex", gap: 6 }}>
                      <input
                        type="time"
                        value={newStartTime}
                        onChange={(e) => setNewStartTime(e.target.value)}
                        title="Kezdés (opcionális)"
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "5px 6px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "#fff",
                          fontFamily: "'Work Sans', sans-serif",
                          color: COLORS.text,
                        }}
                      />
                      <input
                        type="time"
                        value={newEndTime}
                        onChange={(e) => setNewEndTime(e.target.value)}
                        title="Vég (opcionális)"
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "5px 6px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "#fff",
                          fontFamily: "'Work Sans', sans-serif",
                          color: COLORS.text,
                        }}
                      />
                    </div>
                    <select
                      value={newRecurrence}
                      onChange={(e) => setNewRecurrence(e.target.value)}
                      style={{
                        fontSize: 12,
                        padding: "5px 6px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                        color: COLORS.text,
                      }}
                    >
                      {RECUR_OPTIONS.map((o) => (
                        <option key={o.value} value={o.value}>{o.label}</option>
                      ))}
                    </select>
                    <select
                      value={newCategory}
                      onChange={(e) => setNewCategory(e.target.value)}
                      style={{
                        fontSize: 12,
                        padding: "5px 6px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                        color: COLORS.text,
                      }}
                    >
                      {CATEGORY_OPTIONS.map((o) => (
                        <option key={o.value} value={o.value}>{o.label}</option>
                      ))}
                    </select>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button
                        onClick={() => submitTask(day)}
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "6px 0",
                          borderRadius: 8,
                          border: "none",
                          background: COLORS.accent,
                          color: "#fff",
                          cursor: "pointer",
                          fontWeight: 500,
                        }}
                      >
                        Hozzáad
                      </button>
                      <button
                        onClick={closeAddForm}
                        style={{
                          fontSize: 12,
                          padding: "6px 10px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "transparent",
                          color: COLORS.textSoft,
                          cursor: "pointer",
                        }}
                      >
                        Mégse
                      </button>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={() => openAddForm(dKey)}
                    style={{
                      marginTop: 8,
                      fontSize: 12,
                      display: "flex",
                      alignItems: "center",
                      gap: 5,
                      border: "none",
                      background: "transparent",
                      color: COLORS.accentDark,
                      cursor: "pointer",
                      padding: "4px 2px",
                      fontWeight: 500,
                    }}
                  >
                    <Plus size={13} /> Új feladat
                  </button>
                )}
              </div>
            );
          })}
        </div>
        )}

        {/* Compact view: day switcher strip + single day card, for small windows */}
        {isCompact && (() => {
          const day = selectedDay;
          const dKey = dateKey(day);
          const isToday = isSameDay(day, getToday());
          const dayTasks = tasks
            .filter((t) => taskOccursOn(t, day))
            .filter((t) => categoryFilter === "all" || t.category === categoryFilter);
          const isAdding = addingFor === dKey;

          return (
            <div>
              <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
                {weekDays.map((d, i) => {
                  const sel = isSameDay(d, selectedDay);
                  const todayCol = isSameDay(d, getToday());
                  return (
                    <button
                      key={i}
                      onClick={() => setSelectedDay(d)}
                      style={{
                        flex: "1 0 auto",
                        minWidth: 44,
                        border: `1px solid ${sel ? COLORS.accentDark : COLORS.border}`,
                        borderRadius: 12,
                        background: sel ? COLORS.accent : COLORS.panelSoft,
                        color: sel ? "#fff" : todayCol ? COLORS.accentDark : COLORS.text,
                        cursor: "pointer",
                        padding: "6px 4px",
                        display: "flex",
                        flexDirection: "column",
                        alignItems: "center",
                        gap: 2,
                      }}
                    >
                      <span style={{ fontSize: 10, fontWeight: 600 }}>{DAY_LETTERS[i]}</span>
                      <span style={{ fontSize: 13, fontWeight: sel || todayCol ? 700 : 400 }}>{d.getDate()}</span>
                    </button>
                  );
                })}
              </div>

              <div
                style={{
                  background: COLORS.panelSoft,
                  border: `1px solid ${isToday ? COLORS.accent : COLORS.border}`,
                  borderRadius: 18,
                  padding: "16px 14px",
                }}
              >
                <div style={{ marginBottom: 10 }}>
                  <div
                    style={{
                      fontFamily: "'Fraunces', serif",
                      fontWeight: 900,
                      fontSize: 26,
                      lineHeight: 1.1,
                      color: isToday ? COLORS.accentDark : COLORS.text,
                    }}
                  >
                    {DAY_NAMES[weekDays.findIndex((d) => isSameDay(d, day))]}
                    {isToday ? " · ma" : ""}
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.textSoft, marginTop: 2 }}>
                    {pad(day.getDate())}.{pad(day.getMonth() + 1)}.
                  </div>
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 6, minWidth: 0 }}>
                  {renderDayBody(dayTasks, dKey, isToday, isAdding)}
                </div>

                {isAdding ? (
                  <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                    <input
                      type="text"
                      autoFocus
                      value={newText}
                      onChange={(e) => setNewText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") submitTask(day);
                        if (e.key === "Escape") closeAddForm();
                      }}
                      placeholder="Új teendő"
                      style={{
                        fontSize: 13,
                        padding: "6px 8px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                      }}
                    />
                    <div style={{ display: "flex", gap: 6 }}>
                      <input
                        type="time"
                        value={newStartTime}
                        onChange={(e) => setNewStartTime(e.target.value)}
                        title="Kezdés (opcionális)"
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "5px 6px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "#fff",
                          fontFamily: "'Work Sans', sans-serif",
                          color: COLORS.text,
                        }}
                      />
                      <input
                        type="time"
                        value={newEndTime}
                        onChange={(e) => setNewEndTime(e.target.value)}
                        title="Vég (opcionális)"
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "5px 6px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "#fff",
                          fontFamily: "'Work Sans', sans-serif",
                          color: COLORS.text,
                        }}
                      />
                    </div>
                    <select
                      value={newRecurrence}
                      onChange={(e) => setNewRecurrence(e.target.value)}
                      style={{
                        fontSize: 12,
                        padding: "5px 6px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                        color: COLORS.text,
                      }}
                    >
                      {RECUR_OPTIONS.map((o) => (
                        <option key={o.value} value={o.value}>{o.label}</option>
                      ))}
                    </select>
                    <select
                      value={newCategory}
                      onChange={(e) => setNewCategory(e.target.value)}
                      style={{
                        fontSize: 12,
                        padding: "5px 6px",
                        borderRadius: 8,
                        border: `1px solid ${COLORS.border}`,
                        background: "#fff",
                        fontFamily: "'Work Sans', sans-serif",
                        color: COLORS.text,
                      }}
                    >
                      {CATEGORY_OPTIONS.map((o) => (
                        <option key={o.value} value={o.value}>{o.label}</option>
                      ))}
                    </select>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button
                        onClick={() => submitTask(day)}
                        style={{
                          flex: 1,
                          fontSize: 12,
                          padding: "6px 0",
                          borderRadius: 8,
                          border: "none",
                          background: COLORS.accent,
                          color: "#fff",
                          cursor: "pointer",
                          fontWeight: 500,
                        }}
                      >
                        Hozzáad
                      </button>
                      <button
                        onClick={closeAddForm}
                        style={{
                          fontSize: 12,
                          padding: "6px 10px",
                          borderRadius: 8,
                          border: `1px solid ${COLORS.border}`,
                          background: "transparent",
                          color: COLORS.textSoft,
                          cursor: "pointer",
                        }}
                      >
                        Mégse
                      </button>
                    </div>
                  </div>
                ) : (
                  <button
                    onClick={() => openAddForm(dKey)}
                    style={{
                      marginTop: 8,
                      fontSize: 12,
                      display: "flex",
                      alignItems: "center",
                      gap: 5,
                      border: "none",
                      background: "transparent",
                      color: COLORS.accentDark,
                      cursor: "pointer",
                      padding: "4px 2px",
                      fontWeight: 500,
                    }}
                  >
                    <Plus size={13} /> Új feladat
                  </button>
                )}
              </div>
            </div>
          );
        })()}

        {/* General to-do list, not tied to a specific day */}
        <div
          style={{
            marginTop: 28,
            background: COLORS.panelSoft,
            border: `1px solid ${COLORS.border}`,
            borderRadius: 18,
            padding: "18px 22px",
          }}
        >
          <h2
            style={{
              fontFamily: "'Fraunces', serif",
              fontWeight: 900,
              fontSize: 36,
              margin: "0 0 12px",
              color: COLORS.accentDark,
              lineHeight: 1.1,
            }}
          >
            TO-DO
          </h2>

          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fill, minmax(min(260px, 100%), 1fr))",
              gap: 8,
              marginBottom: 14,
            }}
          >
            {filteredGeneral.length === 0 && (
              <div style={{ fontSize: 12, color: COLORS.textSoft, fontStyle: "italic" }}>
                Nincs ilyen kategóriájú teendő
              </div>
            )}
            {filteredGeneral.map((g) => (
              <div
                key={g.id}
                className="task-row"
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 5,
                  background: "#fff",
                  border: `1px solid ${COLORS.border}`,
                  borderRadius: 10,
                  padding: "7px 10px",
                }}
              >
                <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                  <button
                    onClick={() => toggleGeneralTask(g.id)}
                    aria-label={g.completed ? "Kész" : "Nincs kész"}
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: 6,
                      border: `1.5px solid ${COLORS.accent}`,
                      background: g.completed ? COLORS.panel : "transparent",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      cursor: "pointer",
                      flexShrink: 0,
                      marginTop: 0,
                      padding: 0,
                      fontSize: 12,
                      lineHeight: 1,
                    }}
                  >
                    {g.completed && "✅"}
                  </button>
                  <span
                    style={{
                      fontSize: 13,
                      flex: "1 1 0%",
                      minWidth: 0,
                      whiteSpace: "nowrap",
              overflow: "hidden",
              textOverflow: "ellipsis",
                      textDecoration: g.completed ? "line-through" : "none",
                      color: g.completed ? COLORS.textSoft : COLORS.text,
                    }}
                  >
                    {g.text}
                  </span>
                  <button
                    onClick={() => toggleNoteOpen(g.id)}
                    aria-label="Jegyzet"
                    title="Jegyzet"
                    style={{
                      border: "none",
                      background: "transparent",
                      cursor: "pointer",
                      color: g.note ? COLORS.accentDark : COLORS.textSoft,
                      opacity: 1,
                      flexShrink: 0,
                      padding: 0,
                      marginTop: 2,
                      fontSize: 13,
                      lineHeight: 1,
                    }}
                  >
                    🗒️
                  </button>
                  <button
                    onClick={() => deleteGeneralTask(g.id)}
                    aria-label="Törlés"
                    style={{
                      border: "none",
                      background: "transparent",
                      cursor: "pointer",
                      color: COLORS.textSoft,
                      opacity: 1,
                      flexShrink: 0,
                      padding: 0,
                      marginTop: 2,
                    }}
                  >
                    <X size={13} />
                  </button>
                </div>
                {g.category !== "none" && CATEGORY_STYLES[g.category] && (
                  <div style={{ display: "flex", paddingLeft: 24 }}>
                    <span
                      style={{
                        fontSize: 10,
                        fontWeight: 500,
                        padding: "2px 7px",
                        borderRadius: 999,
                        background: CATEGORY_STYLES[g.category].bg,
                        color: CATEGORY_STYLES[g.category].text,
                        whiteSpace: "nowrap",
                      }}
                    >
                      {CATEGORY_STYLES[g.category].label}
                    </span>
                  </div>
                )}
                {expandedNotes.has(g.id) ? (
                  <textarea
                    value={g.note || ""}
                    onChange={(e) => updateGeneralNote(g.id, e.target.value)}
                    placeholder="Jegyzet ehhez a teendőhöz…"
                    style={{
                      marginTop: 4,
                      marginLeft: 24,
                      fontSize: 12,
                      padding: "5px 7px",
                      borderRadius: 8,
                      border: `1px solid ${COLORS.border}`,
                      background: "#fff",
                      fontFamily: "'Work Sans', sans-serif",
                      resize: "vertical",
                      minHeight: 40,
                    }}
                  />
                ) : g.note ? (
                  <div
                    onClick={() => toggleNoteOpen(g.id)}
                    style={{
                      marginTop: 4,
                      marginLeft: 24,
                      fontSize: 11,
                      fontStyle: "italic",
                      color: COLORS.textSoft,
                      cursor: "pointer",
                      whiteSpace: "nowrap",
              overflow: "hidden",
              textOverflow: "ellipsis",
                    }}
                  >
                    {g.note}
                  </div>
                ) : null}
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              type="text"
              value={generalText}
              onChange={(e) => setGeneralText(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") addGeneralTask(); }}
              placeholder="Új általános teendő"
              style={{
                fontSize: 13,
                padding: "8px 10px",
                borderRadius: 8,
                border: `1px solid ${COLORS.border}`,
                background: "#fff",
                fontFamily: "'Work Sans', sans-serif",
                flex: "1 1 200px",
              }}
            />
            <select
              value={generalCategory}
              onChange={(e) => setGeneralCategory(e.target.value)}
              style={{
                fontSize: 13,
                padding: "8px 10px",
                borderRadius: 8,
                border: `1px solid ${COLORS.border}`,
                background: "#fff",
                fontFamily: "'Work Sans', sans-serif",
                color: COLORS.text,
              }}
            >
              {CATEGORY_OPTIONS.map((o) => (
                <option key={o.value} value={o.value}>{o.label}</option>
              ))}
            </select>
            <button
              onClick={addGeneralTask}
              style={{
                fontSize: 13,
                padding: "8px 16px",
                borderRadius: 8,
                border: "none",
                background: COLORS.accent,
                color: "#fff",
                cursor: "pointer",
                fontWeight: 500,
                display: "flex",
                alignItems: "center",
                gap: 6,
              }}
            >
              <Plus size={14} /> Hozzáad
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<WeeklyPlanner />);
</script>
</body>
</html>
